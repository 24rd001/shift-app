<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>シフト管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --bg:            #F1F5F9;
      --card:          #FFFFFF;
      --text:          #0F172A;
      --muted:         #64748B;
      --border:        #E2E8F0;
      --red:           #EF4444;
      --red-light:     #FEF2F2;
      --green:         #10B981;
      --green-light:   #D1FAE5;
      --yellow:        #F59E0B;
      --yellow-light:  #FEF3C7;
      --gray:          #94A3B8;
      --gray-light:    #F8FAFC;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--card);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===================== Screen ===================== */
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ===================== Login ===================== */
    .login-screen {
      background: linear-gradient(160deg, #EEF2FF 0%, #F8FAFC 60%, #fff 100%);
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 28px;
    }

    .login-branding { text-align: center; }

    .login-logo-wrap {
      width: 76px;
      height: 76px;
      background: var(--primary);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 28px rgba(79,70,229,.35);
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 5px;
    }

    .login-card {
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 4px 24px rgba(0,0,0,.09);
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--gray);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text);
      background: var(--gray-light);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      -webkit-appearance: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    .password-wrap { position: relative; }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray);
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--text); }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(79,70,229,.3);
    }
    .login-btn:hover { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(79,70,229,.35); }
    .login-btn:active { transform: scale(.98); }
    .login-btn:disabled { background: var(--gray); box-shadow: none; cursor: not-allowed; transform: none; }

    .error-box {
      background: var(--red-light);
      border: 1px solid #FECACA;
      color: #B91C1C;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      line-height: 1.5;
    }
    .error-box.show { display: block; }

    /* spinner */
    .spin {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rotate .7s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }

    /* ===================== Shifts Screen ===================== */
    .shifts-header {
      background: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon-wrap {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.3px;
    }

    .logout-btn {
      padding: 7px 13px;
      background: var(--gray-light);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .logout-btn:hover { background: var(--border); }

    .shifts-body {
      flex: 1;
      background: var(--bg);
      padding: 18px 14px;
    }

    /* user card */
    .user-card {
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .user-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .user-email { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }

    /* month bar */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .month-label {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.4px;
    }

    .month-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 11px;
      border-radius: 20px;
    }

    /* shift card */
    .shift-card {
      background: #fff;
      border-radius: 14px;
      padding: 15px 15px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-left: 4px solid transparent;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      transition: transform .15s;
    }
    .shift-card:active { transform: scale(.99); }

    .shift-card.s-scheduled { border-left-color: var(--primary); }
    .shift-card.s-cancelled  { border-left-color: var(--red);    opacity: .65; }
    .shift-card.s-swapped    { border-left-color: var(--yellow);  }

    .shift-date-col {
      text-align: center;
      min-width: 42px;
    }

    .s-weekday {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .s-day {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.05;
    }

    .s-month { font-size: 10px; color: var(--muted); }

    /* 土=blue, 日=red */
    .s-weekday.sat, .s-day.sat { color: #2563EB; }
    .s-weekday.sun, .s-day.sun { color: var(--red); }

    .v-divider { width: 1px; height: 46px; background: var(--border); }

    .shift-info { flex: 1; min-width: 0; }

    .s-time {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .s-arrow { color: var(--muted); font-size: 12px; }

    .s-duration { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .s-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .s-scheduled .s-badge { background: var(--primary-light); color: var(--primary); }
    .s-cancelled  .s-badge { background: var(--red-light);    color: var(--red); }
    .s-swapped    .s-badge { background: var(--yellow-light);  color: #92400E; }

    /* states */
    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
      gap: 14px;
      text-align: center;
    }

    .big-spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: rotate .8s linear infinite;
    }

    .state-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--gray-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .state-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .state-sub   { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* reload btn */
    .reload-btn {
      margin-top: 6px;
      padding: 9px 20px;
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .reload-btn:hover { background: #DDD6FE; }
  </style>
</head>
<body>
<div class="app">

  <!-- ==================== Login Screen ==================== -->
  <div class="screen login-screen active" id="loginScreen">

    <div class="login-branding">
      <div class="login-logo-wrap">
        <!-- calendar icon -->
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
          <rect x="8" y="14" width="3" height="3" rx=".5" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div class="login-title">シフト管理</div>
      <div class="login-sub">Shift Management App</div>
    </div>

    <div class="login-card">
      <form id="loginForm" novalidate>

        <div class="input-wrap">
          <label class="form-label" for="emailInput">メールアドレス</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
          <input class="form-input" type="email" id="emailInput"
                 placeholder="staff@example.com"
                 autocomplete="email" inputmode="email" required>
        </div>

        <div class="input-wrap password-wrap">
          <label class="form-label" for="passwordInput">パスワード</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input class="form-input" type="password" id="passwordInput"
                 placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="パスワードを表示">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button class="login-btn" type="submit" id="loginBtn">ログイン</button>
        <div class="error-box" id="errorBox"></div>
      </form>
    </div>

  </div><!-- /loginScreen -->

  <!-- ==================== Shifts Screen ==================== -->
  <div class="screen" id="shiftsScreen">

    <header class="shifts-header">
      <div class="header-brand">
        <div class="header-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <span class="header-title">シフト管理</span>
      </div>
      <button class="logout-btn" id="logoutBtn">ログアウト</button>
    </header>

    <div class="shifts-body">

      <div class="user-card">
        <div class="user-avatar" id="userAvatar">?</div>
        <div>
          <div class="user-label">ログイン中</div>
          <div class="user-email" id="userEmailDisplay">—</div>
        </div>
      </div>

      <div class="month-bar">
        <div class="month-label" id="monthLabel">—</div>
        <div class="month-badge" id="shiftCount">読込中</div>
      </div>//aaa
//rrrrr
      <div id="shiftsContainer">
        <div class="center-state">
          <div class="big-spinner"></div>
          <p class="state-sub">シフトを読み込み中...</p>
        </div>
      </div>

    </div>
  </div><!-- /shiftsScreen -->

</div><!-- /app -->

<script>
  'use strict';

  /* ===== 設定 ===== */
  const COGNITO_URL   = 'https://cognito-idp.ap-northeast-1.amazonaws.com/';
  const CLIENT_ID     = '4c506lmmhb9eh8hg0h5oesj11u';
  const API_BASE      = 'https://xcum14jnu2.execute-api.ap-northeast-1.amazonaws.com/v1';

  const WEEKDAYS = ['日','月','火','水','木','金','土'];
  const STATUS_LABEL = { scheduled:'確定', cancelled:'キャンセル', swapped:'交換済み' };

  /* ===== 状態 ===== */
  let idToken   = localStorage.getItem('idToken');
  let userEmail = localStorage.getItem('userEmail') || '';

  /* ===== 画面切り替え ===== */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ===== Cognito ログイン ===== */
  async function cognitoLogin(email, password) {
    const res = await fetch(COGNITO_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-amz-json-1.1',
        'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth',
      },
      body: JSON.stringify({
        AuthFlow: 'USER_PASSWORD_AUTH',
        ClientId: CLIENT_ID,
        AuthParameters: { USERNAME: email, PASSWORD: password },
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      const MSG = {
        'NotAuthorizedException':    'メールアドレスまたはパスワードが正しくありません',
        'UserNotFoundException':     'メールアドレスまたはパスワードが正しくありません',
        'UserNotConfirmedException': 'メールアドレスの確認が完了していません',
        'TooManyRequestsException':  'しばらく時間をおいてから再度お試しください',
        'PasswordResetRequiredException': 'パスワードのリセットが必要です',
      };
      throw new Error(MSG[data.__type] || data.message || 'ログインに失敗しました');
    }

    if (!data.AuthenticationResult) {
      throw new Error('追加の認証ステップが必要です（管理者に連絡してください）');
    }

    return data.AuthenticationResult.IdToken;
  }

  /* ===== API: シフト取得 ===== */
  async function fetchMyShifts() {
    const res = await fetch(`${API_BASE}/shifts/me`, {
      headers: { Authorization: `Bearer ${idToken}` },
    });

    if (res.status === 401) {
      doLogout();
      throw new Error('セッションが切れました。再ログインしてください。');
    }

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `サーバーエラー (${res.status})`);
    }

    const data = await res.json();
    return Array.isArray(data.shifts) ? data.shifts : [];
  }

  /* ===== 補助関数 ===== */
  function calcDuration(start, end) {
    if (!start || !end) return '';
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    const mins = (eh * 60 + em) - (sh * 60 + sm);
    if (mins <= 0) return '';
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h}時間${m}分` : `${h}時間`;
  }

  function parseDateParts(dateStr) {
    // "2025-06-15" → { month, day, weekdayIndex }
    const d = new Date(dateStr + 'T00:00:00');
    return {
      month: d.getMonth() + 1,
      day:   d.getDate(),
      wi:    d.getDay(),   // 0=日 6=土
    };
  }

  function shiftCardHTML(shift) {
    const { month, day, wi } = parseDateParts(shift.date);
    const wd = WEEKDAYS[wi];
    const isWeekend = wi === 0 ? 'sun' : wi === 6 ? 'sat' : '';
    const status = shift.status || 'scheduled';
    const label  = STATUS_LABEL[status] || status;
    const dur    = calcDuration(shift.startTime, shift.endTime);

    return `
      <div class="shift-card s-${status}">
        <div class="shift-date-col">
          <div class="s-weekday ${isWeekend}">${wd}</div>
          <div class="s-day    ${isWeekend}">${day}</div>
          <div class="s-month">${month}月</div>
        </div>
        <div class="v-divider"></div>
        <div class="shift-info">
          <div class="s-time">
            ${shift.startTime || '--:--'}
            <span class="s-arrow">→</span>
            ${shift.endTime   || '--:--'}
          </div>
          ${dur ? `<div class="s-duration">${dur}</div>` : ''}
        </div>
        <div class="s-badge">${label}</div>
      </div>`;
  }

  /* ===== シフト画面の描画 ===== */
  async function renderShiftsScreen() {
    // ユーザー情報
    const initial = userEmail ? userEmail[0].toUpperCase() : '?';
    document.getElementById('userAvatar').textContent = initial;
    document.getElementById('userEmailDisplay').textContent = userEmail;

    // 月ラベル
    const now = new Date();
    document.getElementById('monthLabel').textContent =
      `${now.getFullYear()}年${now.getMonth() + 1}月`;
    document.getElementById('shiftCount').textContent = '読込中…';

    showScreen('shiftsScreen');

    const container = document.getElementById('shiftsContainer');

    // ローディング表示
    container.innerHTML = `
      <div class="center-state">
        <div class="big-spinner"></div>
        <p class="state-sub">シフトを読み込み中...</p>
      </div>`;

    try {
      const shifts = await fetchMyShifts();

      if (shifts.length === 0) {
        document.getElementById('shiftCount').textContent = '0件';
        container.innerHTML = `
          <div class="center-state">
            <div class="state-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8"  y1="2" x2="8"  y2="6"/>
                <line x1="3"  y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <p class="state-title">シフトがありません</p>
            <p class="state-sub">今月のシフトはまだ<br>登録されていません</p>
          </div>`;
        return;
      }

      // 日付昇順でソート
      shifts.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      document.getElementById('shiftCount').textContent = `${shifts.length}件`;
      container.innerHTML = shifts.map(shiftCardHTML).join('');

    } catch (err) {
      document.getElementById('shiftCount').textContent = 'エラー';
      container.innerHTML = `
        <div class="center-state">
          <div class="state-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <p class="state-title">読み込みに失敗しました</p>
          <p class="state-sub">${err.message}</p>
          <button class="reload-btn" onclick="renderShiftsScreen()">再試行</button>
        </div>`;
    }
  }

  /* ===== ログアウト ===== */
  function doLogout() {
    localStorage.removeItem('idToken');
    localStorage.removeItem('userEmail');
    idToken = null;
    userEmail = '';
    showScreen('loginScreen');
  }

  /* ===== イベント: ログインフォーム ===== */
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const errBox   = document.getElementById('errorBox');

    if (!email || !password) {
      errBox.textContent = 'メールアドレスとパスワードを入力してください';
      errBox.classList.add('show');
      return;
    }

    errBox.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<div class="spin"></div>';

    try {
      idToken   = await cognitoLogin(email, password);
      userEmail = email;
      localStorage.setItem('idToken',   idToken);
      localStorage.setItem('userEmail', userEmail);
      await renderShiftsScreen();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'ログイン';
    }
  });

  /* ===== イベント: パスワード表示切り替え ===== */
  document.getElementById('pwToggle').addEventListener('click', () => {
    const inp = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    // 目アイコン ↔ 目に斜線アイコン
    icon.innerHTML = showing
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  });

  /* ===== イベント: ログアウト ===== */
  document.getElementById('logoutBtn').addEventListener('click', doLogout);

  /* ===== 初期化: 既にログイン済みなら直接シフト画面へ ===== */
  if (idToken) {
    renderShiftsScreen();
  }
</script>
</body>
</html>
